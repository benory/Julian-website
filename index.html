---
layout: null
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #f3eee4;
        background-image:
          radial-gradient(ellipse at 20% 15%, #fffaf1 0%, transparent 60%),
          radial-gradient(ellipse at 85% 90%, #e5dccb 0%, transparent 65%);
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(24px, 5vw, 64px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        display: block;
        box-sizing: border-box;
        max-width: min(100%, 640px);
        max-height: calc(100vh - clamp(48px, 10vw, 128px));
        max-height: calc(100svh - clamp(48px, 10vw, 128px));
        width: auto;
        height: auto;
        object-fit: contain;
        border: 8px solid #fffaf3;
        border-radius: 16px;
        box-shadow:
          0 24px 64px rgb(69 51 28 / 14%),
          0 4px 12px rgb(69 51 28 / 8%);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="{{ '/assets/images/julian.jpg' | relative_url }}" alt="Julian Ory">
    </main>
  </body>
</html>
